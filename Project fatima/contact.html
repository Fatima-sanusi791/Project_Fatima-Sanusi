<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Fatima</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container nav-wrap">
            <a class="logo" href="index.html">Yumeen<span>.</span></a>
            <button class="menu-toggle" aria-label="Toggle navigation">☰</button>
            <nav class="navbar">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="projects.html">Projects</a>
                <a class="active" href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main class="container page">
        <section class="page-heading">
            <p class="eyebrow">LET'S CONNECT</p>
            <h1>Contact <span>Me</span></h1>
            <p>Have a question, project idea, or just want to say hello? Send a message.</p>
        </section>

        <section class="contact-box">
            <form id="contactForm">
                <div class="form-row">
                    <div class="field">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Your name" required>
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>
                </div>
                <div class="field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="7" placeholder="Write your message..." required></textarea>
                </div>
                <button class="btn primary" type="submit">Send Message</button>
                <p id="formMessage" class="form-message"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Fatima Sanusi Mohammed. All rights reserved.</p>
    </footer>
    <script src="js/app.js"></script>
</body>
</html>
